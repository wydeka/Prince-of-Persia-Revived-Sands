[patterns]
; 1 = patterns on (F3 toggles)
enabled=1
; the cycle starts only if at least this many enemies are near the Prince (1 = also against a single enemy)
min_enemies=2
; v2.20: 1 = the wide ring (5.0 units) does not wait for the left mouse: it is up whenever min_enemies fight the Prince (enemies cannot react in 0.5 s, so they keep the distance in advance). 0 = only while the button is held
always_on=0
; holding left mouse this long (ms) starts the 'surround' cycle
hold_ms=220
; ring grows to full distance in this time (ms)
ramp_up_ms=150
; ring stays at full distance this long (ms)
full_ms=4000
; ring shrinks back in this time (ms)
ramp_down_ms=2500
; when the button is released after a charge the ring closes this fast (ms) and every enemy may attack: the Prince is open
release_ramp_ms=4000
; v2.57: 0 = after the button is released the crowd does NOT all attack at once: attacks go through the same one-by-one queue as during the charge (enemies already next to the Prince still may). 1 = everybody may attack
release_open=0
; after releasing a charge no new wide ring starts for this long (ms): the crowd attacks instead of retreating again; 0 = off
after_release_pause_ms=0
; enemies closer than near_attack_distance may start an attack at most once per this many ms (all of them together); 0 = unlimited
near_attack_gap_ms=1500
; 1 = while the ring is wide, enemies start no attacks except the allowed ones
block_attacks=1
; allowed attack comes once per random pause min..max (ms); max=0 = nobody attacks
attack_min_ms=1500
attack_max_ms=4000
; first N ms of the cycle nothing is blocked
punish_ms=300
; enemies closer than this (game units) to the Prince attack without limits while he charges; 0 = off
near_attack_distance=5.0
; after this many ms of the cycle a SECOND / THIRD enemy may attack at the same time
second_attacker_ms=2000
third_attacker_ms=4500
; pauses between attacks shrink while holding, down to this percent
escalate_min_pct=35
; 0 = the ring stays wide as long as the button is held
max_hold_ms=0

[ring_distance]
; distance (game units) of the ring while surrounding, per enemy type; 0 = this type is not changed
soldier=9.4
sergeant=0
wraith=0
scarab=0
ghoul=0
specter=0

[ring_slots]
ring0=0
inner=0
outer=0

[scale_by_enemies]
; 1 = the wide ring depends on how many enemies fight near the Prince
enabled=1
; up to count_few enemies the ring is pct_at_few percent of ring_distance, from count_many enemies on pct_at_many percent (smoothly in between)
count_few=2
count_many=6
pct_at_few=100
pct_at_many=100
; only enemies closer to the Prince than this (game units) are counted
engage_distance=18
; the ring is never narrower than this; 7.82 = nearest ring at 5.0 units = the safe distance from the strong attack (measured: reach 4-5 steps)
min_distance=9.4
; one extra simultaneous attacker per this many enemies (4 enemies: 2 attackers, 8: 3); 0 = off
enemies_per_extra_attacker=4

[last_enemy]
; when the wide ring is already up and only one enemy is left, his pauses are this percent of the normal ones (100 = no change)
pause_pct=100

[retreat]
; 1 = after an attack that missed the group steps back (not when fewer than min_enemies are near the Prince)
enabled=1
; an attack counts as missed if the enemy ends it at least this far (game units) from the Prince; 0 = every attack
missed_distance=2.3
; how far the ring steps back (percent of the full charge ring), how long it stays (ms), how fast it widens (ms)
strength_pct=70
hold_ms=2500
ramp_up_ms=250
min_enemies=2

[tease]
; 1 = while the left mouse is held the ring does not stay fixed: every few seconds it tightens for a moment (a pulse).
; One enemy steps in, teases and may attack; then the ring widens again. Outside a pulse only enemies closer than near_attack_distance may attack.
enabled=1
; 1 = at each pulse the DLL picks one enemy and makes him attack (the game does not ask him by itself); everybody else is not allowed to attack in a pulse
chosen_attacker=1
; only an enemy whose distance to the Prince is between these two values (game units) can be chosen
attacker_min_dist=0.0
attacker_max_dist=7.0
; v2.8: the game only lets an enemy attack if the target is within his reach (a number in the enemy data). For the chosen attacker the DLL raises that number for one check
; (so all other game checks stay) and puts it back at once. v2.13: 3.2 = he may start the swing a little earlier than normal (2.5); 12.0 = any distance; 0 = off
reach_boost=4.2
; 1 = if the game still says no, write its remembered answer for this frame as "yes" (second way; less safe, logged as REAL cache in the trace)
cache_fallback=1
; v2.11: 1 = the chosen attacker may swing only when closer than swing_distance (game units); until then he walks in himself because the ring is tight in a pulse. 0 = old behaviour (swing from afar)
approach=1
; v2.12: 1 = in a pulse only the NEAREST ring tightens (to near_ring_dist) and has near_ring_slots places; the other rings stay wide, so only that many enemies come in. 0 = old: the whole ring tightens (tighten_pct)
near_ring_mode=1
near_ring_dist=2.4
near_ring_slots=2
swing_distance=3.0
; v2.11 experiment (did not work, keep 0): 1 = others claim to be in place
hold_others=0
; the chosen attacker has this long (ms) to arrive and swing
chosen_timeout_ms=3500
; the first pulse comes this long (ms) after the ring is wide; later ones after the pause below
first_pulse_ms=3500
; pause between pulses (ms), random between min and max; it shortens the longer the button is held
gap_min_ms=2500
gap_max_ms=4500
; how long one pulse lasts (ms)
pulse_ms=3600
; how tight the ring gets at the bottom of a pulse: 100 = stays full, 90 = nearest ring at about 4.7 units, 50 = about 3.4, 18 = about 2.2 (the chosen attacker can reach the Prince)
tighten_pct=18
; pauses shrink down to this percent of normal while holding
escalate_min_pct=55

[roll]
; 1 = a chain of rolls makes the ring tighter (experimental; the roll is detected from the Prince speed, see ROLL? lines in the trace)
reaction=1
; horizontal speed (units/s) that counts as a roll; look at PRINCE-MOVE lines in the trace to find the right value
roll_speed=7.0
; the reaction starts from this roll in a row; two rolls closer than window_ms belong to one chain
from_roll=2
window_ms=4000
; ring size in percent of normal while the reaction lasts, and how long it lasts (ms)
tighten_pct=80
hold_ms=3000

[spam]
; 1 = a chain of quick left-click attacks makes the ring step back (experimental; 0 = off)
enabled=0
; the reaction starts from this attack in a row
from_attack=3
; two clicks closer than this (ms) belong to one chain
chain_gap_ms=900
; the ring stays wide this long (ms) after the last click
hold_ms=1500
; strength (percent of the full ring change) on the first reacting attack, and added for each next attack
strength_pct=45
step_pct=15
; the ring widens in this time (ms); it narrows in ramp_down_ms
ramp_up_ms=150

[crowd]
; v2.21: switched off - many places make enemies stand in a narrow arc in front of the Prince (a place every 30 degrees); few places = wide spread around him
; v2.14: 1 = when at least min_enemies fight the Prince, the close rings get more places: more enemies can attack at the same time. 0 = game default (6 / 6 places)
enabled=0
min_enemies=3
close_places=10
inner_places=12

[wave]
; v2.13: 1 = for window_ms after a charge is released only enemies closer than max_distance (game units) may start an attack; the others keep their distance
enabled=1
window_ms=1500
max_distance=3.0

[diag]
; 1 = big memory dumps of walking/standing enemies (SPD/SPDD lines, trace becomes huge). The speed field was not found, keep 0
speed_dump=0
; 1 = extra diagnostics in revived_trace.txt (SLOT, POSCAND, RMGR, SETUP, WATCH, MAP lines); does not change behaviour
enabled=1
; how many chosen-attacker events get the full slot dump (each is about 40 lines)
slot_events=10
; a MAP line (all enemies and their distances) every this many ms while the left mouse is held (0 = off)
map_ms=500

[limit]
; v2.24: 1 = in a normal fight (left mouse not held) at most max_attackers enemies may start an attack within grant_ms; the others have to wait. 0 = game default (everybody who is close attacks)
enabled=1
max_attackers=8
grant_ms=1800

[slots]
; v2.25: 1 = switch off the game's 'straight line to the slot is clear' test. Without it enemies at the back of a crowd get a slot too and walk to it instead of standing still. 0 = game default. Needs a game restart.
ignore_path_block=1
; v2.28: never fewer places than this in the nearest / inner / outer ring (for every enemy type, from the start, also at rest; the numbers are never lowered). 0 = off
min_ring0=8
min_inner=12
min_outer=30

[baseline]
; v2.31: 1 = in a normal fight (at least min_enemies near) the ring is never narrower than pct percent of the full charge ring; attacks are NOT blocked
enabled=0
pct=50

[reach_gate]
; v2.32: 1 = an enemy (not the chosen attacker) may start a swing only when closer than max_distance (game units) to the Prince; farther he walks in first. Fixes swings that stop just short
enabled=0
max_distance=2.4

[flank]
; v2.35: 1 = every enemy gets a random favourite place around the ring; places far from it look up to penalty game units farther away. Enemies then also take places at the sides and behind the Prince. Needs a full game restart (the DLL patches code at start)
enabled=1
penalty=9.0

[melee]
; v2.38: 1 = an enemy that stands closer than distance (game units) to the Prince but the game says "no attack" (its own pause) is pushed to swing, at most once per interval_ms. Answers spam in close fighting. The limit of simultaneous attackers still applies
enabled=1
distance=2.2
interval_ms=900

[roll_lag]
; v2.50: OFF (feels bad, user rejected input blocking). v2.44: your roll idea. The 1st roll of a chain is normal. After the 2nd and every next roll (rolls closer than [roll] window_ms = 4000 ms) the Prince is "tired":
; for step_ms * (roll number - 1) ms after the roll ends (not more than max_ms) the roll key (Ctrl) is ignored. The roll itself and its invulnerability are NOT changed.
; After window_ms without a roll the fatigue is gone. Works by filtering the keyboard in DirectInput. Needs a full game restart to switch on; F5 reloads the numbers.
enabled=0
step_ms=300
max_ms=900
; 1 = during the lag also ignore Space (jump)
block_jump=1
; 1 = during the lag also ignore W A S D / arrows (the Prince cannot run away at once)
block_move=1

[roll_fatigue]
; v2.41: 1 = the first roll is normal; every next roll of a chain (rolls closer than [roll] window_ms) makes the recovery after the roll longer by grow_pct percent, up to max_pct percent. Works by rewriting the length (frames) of the roll-end clips in memory. Needs a full game restart to switch on
enabled=0
grow_pct=40
max_pct=250
; v2.42 TEST ONLY: 1 = also stretch the roll clips themselves (not only the recovery) to see whether rewriting clip lengths in memory changes anything. Needs a full game restart
test_include_roll_clips=0

[wounded]
; v2.42 diagnostic: 1 = the DLL asks the game "has this enemy a pending damage reaction / is he stunned" and writes HITSIG lines to the trace when it changes. Does not change behaviour
probe_hits=1
; v2.53: an enemy hit this many times (swing = 1 hit, 20 s without hits = healed) is 'wounded': it does not start attacks unless the Prince is closer than attack_dist_x10/10
enabled=1
hits_to_wound=2
attack_dist_x10=22
; wounded status lasts this long after the last hit (ms), then the enemy returns to the fight
wound_ms=5000
; 1 = a wounded enemy is moved to the outer ring (he gets no place in the two inner rings); 0 = he just stands where he is
outer_ring=1
; with this many enemies near the Prince or fewer a wounded enemy keeps fighting
min_enemies=5

[shield]
; 1 = shield-bearers do not back off while the Prince holds LMB (the ring answer is 'in place' for them)
no_retreat=0
; 1 = shield-bearers do not count as 'crowd': a charge against shield-bearers only does not widen the ring
ignore_in_count=1

[mixed]
; 1 = when soldiers and shield-bearers fight together and the Prince charges, soldiers never attack, shield-bearers take the blow
shield_first=1
; soldiers farther than this (x10 units) from the Prince do not walk in while he charges in a mixed crowd
soldier_hold_x10=9999
; a soldier closer than this (x10 units) to the Prince may attack in a mixed crowd
soldier_free_x10=30

[heal]
; 1 = a health pickup (vase, barrel, orb) restores only scale_pct percent of its amount. Loading a map or dying is never touched
enabled=1
scale_pct=50

[log]
; 1 = write revived_log.txt and revived_trace.txt and enable the developer keys F4/F6/F7/F8/F9 (for bug reports; read at game start). 0 = write nothing. Public builds default to 0
enabled=0
